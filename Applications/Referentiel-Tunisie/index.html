<!doctype html>
<html lang="fr">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Référentiel géographique administratif de la Tunisie</title>

  <script type="module" src="https://geomapia.github.io/Applications/Referentiel-Tunisie/assets/index-KRuaT5Dk.js"></script>
  <link rel="stylesheet" href="https://geomapia.github.io/Applications/Referentiel-Tunisie/assets/index-BAA5kDtG.css">

  <style>
    .geomap-admin-hierarchy-row {
      margin: 0 0 12px 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    .geomap-admin-hierarchy-row label {
      display: block;
      margin: 0 0 6px 0;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .geomap-admin-hierarchy-row select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      color: #0f172a;
      padding: 9px 10px;
      font-family: Inter, Arial, sans-serif;
      font-size: 13px;
      outline: none;
    }

    .geomap-admin-hierarchy-row select:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .geomap-admin-hierarchy-note {
      margin: 7px 0 0 0;
      color: #64748b;
      font-family: Inter, Arial, sans-serif;
      font-size: 11px;
      line-height: 1.4;
    }

    .geomap-admin-hierarchy-status {
      margin: 8px 0 12px 0;
      padding: 8px 9px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      font-family: Inter, Arial, sans-serif;
      font-size: 11px;
      line-height: 1.4;
    }

    .geomap-admin-hierarchy-status.success {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .geomap-admin-hierarchy-status.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    (function () {
      const DISTRICTS = {
        "District 1": ["Béja", "Bizerte", "Jendouba", "Le Kef"],
        "District 2": ["Ariana", "Ben Arous", "Manouba", "Nabeul", "Tunis", "Zaghouan"],
        "District 3": ["Kairouan", "Kasserine", "Mahdia", "Monastir", "Siliana", "Sousse"],
        "District 4": ["Gafsa", "Sfax", "Sidi Bouzid", "Tozeur"],
        "District 5": ["Gabès", "Kébili", "Médenine", "Tataouine"]
      };

      const REGIONS_GEOGRAPHIQUES = {
        "Nord-Est": ["Tunis", "Ariana", "Ben Arous", "Manouba", "Nabeul", "Zaghouan", "Bizerte"],
        "Nord-Ouest": ["Béja", "Jendouba", "Le Kef", "Siliana"],
        "Centre-Est": ["Sousse", "Monastir", "Mahdia", "Sfax"],
        "Centre-Ouest": ["Kairouan", "Kasserine", "Sidi Bouzid"],
        "Sud-Ouest": ["Gafsa", "Tozeur", "Kébili"],
        "Sud-Est": ["Gabès", "Médenine", "Tataouine"]
      };

      const ALL_GOVERNORATES = [
        "Tunis",
        "Ariana",
        "Ben Arous",
        "Manouba",
        "Nabeul",
        "Zaghouan",
        "Bizerte",
        "Béja",
        "Jendouba",
        "Le Kef",
        "Siliana",
        "Sousse",
        "Monastir",
        "Mahdia",
        "Sfax",
        "Kairouan",
        "Kasserine",
        "Sidi Bouzid",
        "Gafsa",
        "Tozeur",
        "Kébili",
        "Gabès",
        "Médenine",
        "Tataouine"
      ];

      let isApplyingFilter = false;
      let lastKnownGovernorateSelect = null;

      function normalizeText(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[’']/g, " ")
          .replace(/[^a-zA-Z0-9\u0600-\u06FF]+/g, " ")
          .toLowerCase()
          .trim();
      }

      function makeNormalizedSet(values) {
        return new Set(
          values.map(function (value) {
            return normalizeText(value);
          })
        );
      }

      function isPlaceholderOption(option) {
        const text = normalizeText(option.textContent);
        const value = normalizeText(option.value);

        if (!value) return true;

        return (
          text === "" ||
          text.includes("tous") ||
          text.includes("toutes") ||
          text.includes("selection") ||
          text.includes("sélection") ||
          text.includes("choisir") ||
          text.includes("aucun") ||
          text.includes("الكل") ||
          text.includes("اختر")
        );
      }

      function governorateFromOption(option) {
        const text = normalizeText(option.textContent);
        const value = normalizeText(option.value);

        for (const governorate of ALL_GOVERNORATES) {
          const normalizedGovernorate = normalizeText(governorate);

          if (
            text === normalizedGovernorate ||
            value === normalizedGovernorate ||
            text.includes(normalizedGovernorate) ||
            value.includes(normalizedGovernorate)
          ) {
            return governorate;
          }
        }

        return "";
      }

      function getSelectedAllowedGovernorates() {
        const districtSelect = document.getElementById("geomap-admin-district-select");
        const regionSelect = document.getElementById("geomap-admin-region-select");

        const selectedDistrict = districtSelect ? districtSelect.value : "";
        const selectedRegion = regionSelect ? regionSelect.value : "";

        let allowed = new Set(
          ALL_GOVERNORATES.map(function (governorate) {
            return normalizeText(governorate);
          })
        );

        if (selectedDistrict && DISTRICTS[selectedDistrict]) {
          const districtSet = makeNormalizedSet(DISTRICTS[selectedDistrict]);

          allowed = new Set(
            Array.from(allowed).filter(function (governorate) {
              return districtSet.has(governorate);
            })
          );
        }

        if (selectedRegion && REGIONS_GEOGRAPHIQUES[selectedRegion]) {
          const regionSet = makeNormalizedSet(REGIONS_GEOGRAPHIQUES[selectedRegion]);

          allowed = new Set(
            Array.from(allowed).filter(function (governorate) {
              return regionSet.has(governorate);
            })
          );
        }

        return allowed;
      }

      function dispatchSelectChange(selectElement) {
        if (!selectElement) return;

        selectElement.dispatchEvent(new Event("input", { bubbles: true }));
        selectElement.dispatchEvent(new Event("change", { bubbles: true }));
      }

      function resetSelectToPlaceholder(selectElement) {
        if (!selectElement) return;

        const options = Array.from(selectElement.options || []);
        const placeholder = options.find(isPlaceholderOption);
        const visibleAllowed = options.find(function (option) {
          return !option.disabled && !option.hidden;
        });

        if (placeholder) {
          selectElement.value = placeholder.value;
        } else if (visibleAllowed) {
          selectElement.value = visibleAllowed.value;
        } else {
          selectElement.selectedIndex = 0;
        }
      }

      function applyGovernorateFilter() {
        if (isApplyingFilter) return;

        isApplyingFilter = true;

        try {
          const governorateSelect = findGovernorateSelect();

          if (!governorateSelect) {
            setHierarchyStatus(
              "Les niveaux District et Région géographique sont prêts. Ouvrez le panneau Découpage administratif pour appliquer le filtrage.",
              "neutral"
            );
            isApplyingFilter = false;
            return;
          }

          lastKnownGovernorateSelect = governorateSelect;

          const allowed = getSelectedAllowedGovernorates();
          const options = Array.from(governorateSelect.options || []);
          let visibleGovernoratesCount = 0;
          let selectedOptionStillAllowed = false;

          options.forEach(function (option) {
            const governorateName = governorateFromOption(option);
            const isPlaceholder = isPlaceholderOption(option);

            if (isPlaceholder || !governorateName) {
              option.hidden = false;
              option.disabled = false;
              option.style.display = "";
              return;
            }

            const isAllowed = allowed.has(normalizeText(governorateName));

            option.hidden = !isAllowed;
            option.disabled = !isAllowed;
            option.style.display = isAllowed ? "" : "none";

            if (isAllowed) {
              visibleGovernoratesCount += 1;
            }

            if (option.selected && isAllowed) {
              selectedOptionStillAllowed = true;
            }
          });

          const selectedOption = governorateSelect.options[governorateSelect.selectedIndex];

          if (
            selectedOption &&
            !isPlaceholderOption(selectedOption) &&
            !selectedOptionStillAllowed
          ) {
            resetSelectToPlaceholder(governorateSelect);
            dispatchSelectChange(governorateSelect);
          }

          if (visibleGovernoratesCount === 0) {
            setHierarchyStatus(
              "Aucun gouvernorat ne correspond simultanément au district et à la région géographique choisis.",
              "error"
            );
          } else {
            setHierarchyStatus(
              "Filtrage appliqué : " + visibleGovernoratesCount + " gouvernorat(s) disponible(s).",
              "success"
            );
          }
        } catch (error) {
          setHierarchyStatus(
            "Le filtrage des gouvernorats n’a pas pu être appliqué automatiquement.",
            "error"
          );
        }

        isApplyingFilter = false;
      }

      function setHierarchyStatus(message, type) {
        const status = document.getElementById("geomap-admin-hierarchy-status");

        if (!status) return;

        status.textContent = message;
        status.classList.remove("success", "error");

        if (type === "success") {
          status.classList.add("success");
        }

        if (type === "error") {
          status.classList.add("error");
        }
      }

      function findSmallestElementContaining(text) {
        const searched = normalizeText(text);

        const elements = Array.from(
          document.querySelectorAll("aside, section, nav, form, div, main, article, h1, h2, h3, h4, label, span, p")
        );

        const matches = elements
          .filter(function (element) {
            return normalizeText(element.textContent).includes(searched);
          })
          .sort(function (a, b) {
            return a.textContent.length - b.textContent.length;
          });

        return matches[0] || null;
      }

      function findAdministrativePanel() {
        const titleElement =
          findSmallestElementContaining("Découpage administratif") ||
          findSmallestElementContaining("decoupage administratif");

        if (!titleElement) return null;

        let candidate = titleElement;

        while (candidate && candidate !== document.body) {
          const text = normalizeText(candidate.textContent);

          if (
            text.includes("decoupage administratif") &&
            (
              text.includes("gouvernorat") ||
              text.includes("delegation") ||
              text.includes("délégation") ||
              text.includes("secteur")
            )
          ) {
            return candidate;
          }

          candidate = candidate.parentElement;
        }

        candidate = titleElement.parentElement;

        while (candidate && candidate !== document.body) {
          const text = normalizeText(candidate.textContent);

          if (
            text.includes("decoupage administratif") ||
            text.includes("gouvernorat")
          ) {
            return candidate;
          }

          candidate = candidate.parentElement;
        }

        return titleElement.parentElement || null;
      }

      function elementComesAfter(a, b) {
        if (!a || !b || a === b) return false;

        return Boolean(
          b.compareDocumentPosition(a) & Node.DOCUMENT_POSITION_FOLLOWING
        );
      }

      function findSelectNearLabel(labelElement, panel) {
        if (!labelElement) return null;

        const labelFor = labelElement.getAttribute && labelElement.getAttribute("for");

        if (labelFor) {
          const linked = document.getElementById(labelFor);

          if (linked && linked.tagName === "SELECT") {
            return linked;
          }
        }

        let cursor = labelElement;

        for (let i = 0; i < 5 && cursor; i += 1) {
          if (cursor.querySelector) {
            const selectInside = cursor.querySelector("select");

            if (selectInside) {
              return selectInside;
            }
          }

          cursor = cursor.parentElement;

          if (cursor === panel || cursor === document.body) {
            break;
          }
        }

        const allSelects = Array.from((panel || document).querySelectorAll("select"));
        const followingSelect = allSelects.find(function (select) {
          return elementComesAfter(select, labelElement);
        });

        return followingSelect || null;
      }

      function findGovernorateSelect() {
        const panel = findAdministrativePanel() || document;

        const candidates = Array.from(
          panel.querySelectorAll("label, div, span, p, h2, h3, h4")
        )
          .filter(function (element) {
            return normalizeText(element.textContent).includes("gouvernorat");
          })
          .sort(function (a, b) {
            return a.textContent.length - b.textContent.length;
          });

        for (const candidate of candidates) {
          const select = findSelectNearLabel(candidate, panel);

          if (select && select.tagName === "SELECT") {
            return select;
          }
        }

        const allSelects = Array.from(panel.querySelectorAll("select"));

        for (const select of allSelects) {
          const hasGovernorateOption = Array.from(select.options || []).some(function (option) {
            return Boolean(governorateFromOption(option));
          });

          if (hasGovernorateOption) {
            return select;
          }
        }

        return lastKnownGovernorateSelect;
      }

      function findGovernorateReferenceElement(panel) {
        if (!panel) return null;

        const candidates = Array.from(
          panel.querySelectorAll("label, div, span, p, h2, h3, h4")
        )
          .filter(function (element) {
            return normalizeText(element.textContent).includes("gouvernorat");
          })
          .sort(function (a, b) {
            return a.textContent.length - b.textContent.length;
          });

        if (!candidates.length) return null;

        let target = candidates[0];

        while (
          target.parentElement &&
          target.parentElement !== panel &&
          target.parentElement !== document.body &&
          target.parentElement.textContent &&
          target.parentElement.textContent.length < 900 &&
          normalizeText(target.parentElement.textContent).includes("gouvernorat")
        ) {
          target = target.parentElement;
        }

        return target;
      }

      function createHierarchyControls() {
        const fragment = document.createDocumentFragment();

        const districtRow = document.createElement("div");
        districtRow.className = "geomap-admin-hierarchy-row";
        districtRow.id = "geomap-admin-district-row";
        districtRow.innerHTML = [
          '<label for="geomap-admin-district-select">1. District / الإقليم</label>',
          '<select id="geomap-admin-district-select">',
          '  <option value="">Tous les districts / كل الأقاليم</option>',
          '  <option value="District 1">District 1 — Béja, Bizerte, Jendouba, Le Kef</option>',
          '  <option value="District 2">District 2 — Ariana, Ben Arous, Manouba, Nabeul, Tunis, Zaghouan</option>',
          '  <option value="District 3">District 3 — Kairouan, Kasserine, Mahdia, Monastir, Siliana, Sousse</option>',
          '  <option value="District 4">District 4 — Gafsa, Sfax, Sidi Bouzid, Tozeur</option>',
          '  <option value="District 5">District 5 — Gabès, Kébili, Médenine, Tataouine</option>',
          '</select>'
        ].join("");

        const regionRow = document.createElement("div");
        regionRow.className = "geomap-admin-hierarchy-row";
        regionRow.id = "geomap-admin-region-row";
        regionRow.innerHTML = [
          '<label for="geomap-admin-region-select">2. Région géographique</label>',
          '<select id="geomap-admin-region-select">',
          '  <option value="">Toutes les régions géographiques</option>',
          '  <option value="Nord-Est">Nord-Est — Tunis, Ariana, Ben Arous, Manouba, Nabeul, Zaghouan, Bizerte</option>',
          '  <option value="Nord-Ouest">Nord-Ouest — Béja, Jendouba, Le Kef, Siliana</option>',
          '  <option value="Centre-Est">Centre-Est — Sousse, Monastir, Mahdia, Sfax</option>',
          '  <option value="Centre-Ouest">Centre-Ouest — Kairouan, Kasserine, Sidi Bouzid</option>',
          '  <option value="Sud-Ouest">Sud-Ouest — Gafsa, Tozeur, Kébili</option>',
          '  <option value="Sud-Est">Sud-Est — Gabès, Médenine, Tataouine</option>',
          '</select>',
          '<p class="geomap-admin-hierarchy-note">',
          '  Les districts et les régions géographiques filtrent la liste des gouvernorats. ',
          '  Si les deux sont choisis, seuls les gouvernorats communs aux deux niveaux restent visibles.',
          '</p>'
        ].join("");

        const status = document.createElement("div");
        status.className = "geomap-admin-hierarchy-status";
        status.id = "geomap-admin-hierarchy-status";
        status.textContent = "Filtres supérieurs prêts : District / الإقليم et Région géographique.";

        fragment.appendChild(districtRow);
        fragment.appendChild(regionRow);
        fragment.appendChild(status);

        return fragment;
      }

      function insertHierarchyControlsIntoAdministrativePanel() {
        if (
          document.getElementById("geomap-admin-district-row") &&
          document.getElementById("geomap-admin-region-row")
        ) {
          return true;
        }

        const panel = findAdministrativePanel();

        if (!panel) {
          return false;
        }

        const governorateReference = findGovernorateReferenceElement(panel);
        const controls = createHierarchyControls();

        if (
          governorateReference &&
          governorateReference.parentElement &&
          governorateReference.parentElement !== document.body
        ) {
          governorateReference.parentElement.insertBefore(controls, governorateReference);
        } else {
          panel.appendChild(controls);
        }

        const districtSelect = document.getElementById("geomap-admin-district-select");
        const regionSelect = document.getElementById("geomap-admin-region-select");

        if (districtSelect) {
          districtSelect.addEventListener("change", applyGovernorateFilter);
          districtSelect.addEventListener("input", applyGovernorateFilter);
        }

        if (regionSelect) {
          regionSelect.addEventListener("change", applyGovernorateFilter);
          regionSelect.addEventListener("input", applyGovernorateFilter);
        }

        setTimeout(applyGovernorateFilter, 300);
        setTimeout(applyGovernorateFilter, 900);
        setTimeout(applyGovernorateFilter, 1600);

        return true;
      }

      function renumberExistingAdministrativeLabels() {
        const panel = findAdministrativePanel();

        if (!panel) return;

        const elements = Array.from(
          panel.querySelectorAll("label, div, span, p, h2, h3, h4")
        );

        elements.forEach(function (element) {
          const text = normalizeText(element.textContent);

          if (
            text.includes("gouvernorat") &&
            !text.includes("district") &&
            !text.includes("region")
          ) {
            element.setAttribute("data-geomap-level", "3");
          }

          if (
            (
              text.includes("delegation") ||
              text.includes("délégation")
            ) &&
            !text.includes("gouvernorat")
          ) {
            element.setAttribute("data-geomap-level", "4");
          }

          if (
            text.includes("secteur") &&
            !text.includes("delegation") &&
            !text.includes("délégation")
          ) {
            element.setAttribute("data-geomap-level", "5");
          }
        });
      }

      function startHierarchyIntegration() {
        const inserted = insertHierarchyControlsIntoAdministrativePanel();

        if (inserted) {
          renumberExistingAdministrativeLabels();
          applyGovernorateFilter();
        }

        const observer = new MutationObserver(function () {
          const controlsInserted = insertHierarchyControlsIntoAdministrativePanel();

          if (controlsInserted) {
            renumberExistingAdministrativeLabels();
            applyGovernorateFilter();
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });

        let tries = 0;

        const interval = setInterval(function () {
          tries += 1;

          const controlsInserted = insertHierarchyControlsIntoAdministrativePanel();

          if (controlsInserted) {
            renumberExistingAdministrativeLabels();
            applyGovernorateFilter();
          }

          if (tries >= 80) {
            clearInterval(interval);
          }
        }, 500);

        document.addEventListener("change", function (event) {
          if (
            event.target &&
            event.target.tagName === "SELECT" &&
            event.target.id !== "geomap-admin-district-select" &&
            event.target.id !== "geomap-admin-region-select"
          ) {
            setTimeout(applyGovernorateFilter, 150);
          }
        }, true);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startHierarchyIntegration);
      } else {
        startHierarchyIntegration();
      }
    })();
  </script>
</body>
</html>
