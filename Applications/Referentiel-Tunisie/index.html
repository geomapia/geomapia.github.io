  <title>Référentiel géographique administratif de la Tunisie</title>

  <script>
    (function () {
      const originalFetch = window.fetch.bind(window);

      window.__geomapIAGeojsonCache = {
        layers: [],
        startedAt: new Date().toISOString()
      };

      window.fetch = async function (input, init) {
        const response = await originalFetch(input, init);

        try {
          const url =
            typeof input === "string"
              ? input
              : input && input.url
                ? input.url
                : "";

          const contentType = response.headers.get("content-type") || "";

          if (
            response.ok &&
            (
              contentType.includes("json") ||
              url.toLowerCase().includes(".json") ||
              url.toLowerCase().includes(".geojson")
            )
          ) {
            response
              .clone()
              .json()
              .then(function (data) {
                if (
                  data &&
                  data.type === "FeatureCollection" &&
                  Array.isArray(data.features)
                ) {
                  window.__geomapIAGeojsonCache.layers.push({
                    url: url,
                    count: data.features.length,
                    data: data,
                    capturedAt: new Date().toISOString()
                  });
                }
              })
              .catch(function () {});
          }
        } catch (error) {}

        return response;
      };
    })();
  </script>

<body>
  <div id="root"></div>

  <script>
    (function () {
      const DISTRICTS = {
        "District 1": ["Béja", "Bizerte", "Jendouba", "Le Kef"],
        "District 2": ["Ariana", "Ben Arous", "Manouba", "Nabeul", "Tunis", "Zaghouan"],
        "District 3": ["Kairouan", "Kasserine", "Mahdia", "Monastir", "Siliana", "Sousse"],
        "District 4": ["Gafsa", "Sfax", "Sidi Bouzid", "Tozeur"],
        "District 5": ["Gabès", "Kébili", "Médenine", "Tataouine"]
      };

      const NAME_KEYS = [
        "gouvernorat",
        "Gouvernorat",
        "GOUVERNORAT",
        "nom_gouv",
        "NOM_GOUV",
        "nom_gouvernorat",
        "NOM_GOUVERNORAT",
        "nom",
        "Nom",
        "NOM",
        "name",
        "Name",
        "NAME",
        "NAME_1",
        "shapeName",
        "libelle",
        "Libelle",
        "LIBELLE",
        "admin1Name",
        "ADM1_FR",
        "ADM1_EN"
      ];

      function normalizeText(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[’']/g, " ")
          .replace(/[^a-zA-Z0-9]+/g, " ")
          .toLowerCase()
          .trim();
      }

      const GOVERNORATE_TO_DISTRICT = {};

      Object.keys(DISTRICTS).forEach(function (districtName) {
        DISTRICTS[districtName].forEach(function (governorateName) {
          GOVERNORATE_TO_DISTRICT[normalizeText(governorateName)] = districtName;
        });
      });

      function getGovernorateName(feature) {
        const properties = feature && feature.properties ? feature.properties : {};

        for (const key of NAME_KEYS) {
          if (properties[key]) {
            return String(properties[key]).trim();
          }
        }

        for (const key in properties) {
          if (!Object.prototype.hasOwnProperty.call(properties, key)) continue;

          const value = properties[key];

          if (
            typeof value === "string" &&
            GOVERNORATE_TO_DISTRICT[normalizeText(value)]
          ) {
            return value.trim();
          }
        }

        return "";
      }

      function isGovernorateFeatureCollection(geojson) {
        if (
          !geojson ||
          geojson.type !== "FeatureCollection" ||
          !Array.isArray(geojson.features)
        ) {
          return false;
        }

        const matched = geojson.features.filter(function (feature) {
          const name = getGovernorateName(feature);
          return Boolean(GOVERNORATE_TO_DISTRICT[normalizeText(name)]);
        });

        return matched.length >= 20;
      }

      function getCachedGovernoratesLayer() {
        const cache =
          window.__geomapIAGeojsonCache &&
          Array.isArray(window.__geomapIAGeojsonCache.layers)
            ? window.__geomapIAGeojsonCache.layers
            : [];

        const exactCandidate = cache.find(function (item) {
          return item.count === 24 && isGovernorateFeatureCollection(item.data);
        });

        if (exactCandidate) {
          return exactCandidate.data;
        }

        const compatibleCandidate = cache.find(function (item) {
          return isGovernorateFeatureCollection(item.data);
        });

        return compatibleCandidate ? compatibleCandidate.data : null;
      }

      async function fetchCandidateGovernorates() {
        const candidateUrls = [
          "data/gouvernorats.geojson",
          "data/gouvernorats.json",
          "data/gouvernorat.geojson",
          "data/gouvernorat.json",
          "data/Gouvernorats.geojson",
          "data/Gouvernorats.json",
          "data/tunisie_gouvernorats.geojson",
          "data/tunisie_gouvernorats.json",
          "data/tunisia_governorates.geojson",
          "data/tunisia_governorates.json",
          "data/tn_gouvernorats.geojson",
          "data/tn_gouvernorats.json",
          "public/data/gouvernorats.geojson",
          "public/data/gouvernorats.json"
        ];

        for (const url of candidateUrls) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) continue;

            const data = await response.json();

            if (isGovernorateFeatureCollection(data)) {
              return data;
            }
          } catch (error) {}
        }

        return null;
      }

      async function getGovernoratesLayer() {
        const cached = getCachedGovernoratesLayer();

        if (cached) {
          return cached;
        }

        for (let attempt = 0; attempt < 24; attempt++) {
          await new Promise(function (resolve) {
            setTimeout(resolve, 500);
          });

          const layer = getCachedGovernoratesLayer();

          if (layer) {
            return layer;
          }
        }

        return await fetchCandidateGovernorates();
      }

      function buildDistrictGeoJSON(governoratesGeojson, districtName) {
        const selectedNames = new Set(
          DISTRICTS[districtName].map(function (name) {
            return normalizeText(name);
          })
        );

        const features = governoratesGeojson.features
          .filter(function (feature) {
            const governorateName = getGovernorateName(feature);
            return selectedNames.has(normalizeText(governorateName));
          })
          .map(function (feature) {
            const cloned = JSON.parse(JSON.stringify(feature));
            const governorateName = getGovernorateName(cloned);

            cloned.properties = cloned.properties || {};
            cloned.properties.niveau_administratif = "District";
            cloned.properties.district = districtName;
            cloned.properties.nom_district = districtName;
            cloned.properties.nom_gouvernorat = governorateName;

            return cloned;
          });

        const foundNames = new Set(
          features.map(function (feature) {
            return normalizeText(getGovernorateName(feature));
          })
        );

        const missing = DISTRICTS[districtName].filter(function (name) {
          return !foundNames.has(normalizeText(name));
        });

        return {
          geojson: {
            type: "FeatureCollection",
            name: districtName.replace(/\s+/g, "_").toLowerCase(),
            metadata: {
              source: "Geomap IA — Référentiel géographique administratif de la Tunisie",
              niveau_administratif: "District",
              niveau_superieur: "District",
              niveau_inferieur: "Gouvernorat",
              export_type: "district",
              district: districtName,
              mode: "gouvernorats_constitutifs_non_dissous",
              generated_at: new Date().toISOString()
            },
            features: features
          },
          missing: missing
        };
      }

      function downloadTextFile(filename, content, mimeType) {
        const blob = new Blob([content], {
          type: mimeType + ";charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();

        setTimeout(function () {
          URL.revokeObjectURL(url);
          link.remove();
        }, 300);
      }

      function safeFileName(value) {
        return normalizeText(value)
          .replace(/\s+/g, "_")
          .replace(/[^a-z0-9_]/g, "");
      }

      function exportGeoJSON(geojson, districtName) {
        downloadTextFile(
          safeFileName(districtName) + ".geojson",
          JSON.stringify(geojson, null, 2),
          "application/geo+json"
        );
      }

      function csvEscape(value) {
        const text = value === null || value === undefined ? "" : String(value);

        if (/[",\n;]/.test(text)) {
          return '"' + text.replace(/"/g, '""') + '"';
        }

        return text;
      }

      function exportCSV(geojson, districtName) {
        const rows = geojson.features.map(function (feature) {
          return feature.properties || {};
        });

        const headers = Array.from(
          rows.reduce(function (set, row) {
            Object.keys(row).forEach(function (key) {
              set.add(key);
            });
            return set;
          }, new Set())
        );

        const csv = [
          headers.join(";")
        ].concat(
          rows.map(function (row) {
            return headers.map(function (header) {
              return csvEscape(row[header]);
            }).join(";");
          })
        ).join("\n");

        downloadTextFile(
          safeFileName(districtName) + "_attributs.csv",
          csv,
          "text/csv"
        );
      }

      function coordinatesToKml(coordinates) {
        return coordinates
          .map(function (coordinate) {
            return coordinate[0] + "," + coordinate[1] + ",0";
          })
          .join(" ");
      }

      function polygonToKml(coordinates) {
        const outerRing = coordinates[0] || [];
        const innerRings = coordinates.slice(1);

        let kml = "";
        kml += "<Polygon>";
        kml += "<outerBoundaryIs><LinearRing><coordinates>";
        kml += coordinatesToKml(outerRing);
        kml += "</coordinates></LinearRing></outerBoundaryIs>";

        innerRings.forEach(function (ring) {
          kml += "<innerBoundaryIs><LinearRing><coordinates>";
          kml += coordinatesToKml(ring);
          kml += "</coordinates></LinearRing></innerBoundaryIs>";
        });

        kml += "</Polygon>";

        return kml;
      }

      function geometryToKml(geometry) {
        if (!geometry) return "";

        if (geometry.type === "Polygon") {
          return polygonToKml(geometry.coordinates);
        }

        if (geometry.type === "MultiPolygon") {
          return "<MultiGeometry>" +
            geometry.coordinates.map(polygonToKml).join("") +
            "</MultiGeometry>";
        }

        return "";
      }

      function xmlEscape(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&apos;");
      }

      function exportKML(geojson, districtName) {
        const placemarks = geojson.features.map(function (feature) {
          const properties = feature.properties || {};
          const name =
            properties.nom_gouvernorat ||
            getGovernorateName(feature) ||
            districtName;

          const description = Object.keys(properties)
            .map(function (key) {
              return "<tr><td><b>" + xmlEscape(key) + "</b></td><td>" + xmlEscape(properties[key]) + "</td></tr>";
            })
            .join("");

          return [
            "<Placemark>",
            "<name>" + xmlEscape(name) + "</name>",
            "<description><![CDATA[<table>" + description + "</table>]]></description>",
            geometryToKml(feature.geometry),
            "</Placemark>"
          ].join("");
        }).join("");

        const kml = [
          '<?xml version="1.0" encoding="UTF-8"?>',
          '<kml xmlns="http://www.opengis.net/kml/2.2">',
          "<Document>",
          "<name>" + xmlEscape(districtName) + "</name>",
          placemarks,
          "</Document>",
          "</kml>"
        ].join("");

        downloadTextFile(
          safeFileName(districtName) + ".kml",
          kml,
          "application/vnd.google-earth.kml+xml"
        );
      }

      function setDistrictStatus(message, type) {
        const status = document.getElementById("geomap-district-admin-status");

        if (!status) {
          return;
        }

        status.textContent = message;
        status.classList.remove("success", "error");

        if (type === "success") {
          status.classList.add("success");
        }

        if (type === "error") {
          status.classList.add("error");
        }
      }

      async function handleDistrictDownload() {
        const districtSelect = document.getElementById("geomap-district-select");
        const formatSelect = document.getElementById("geomap-district-format");

        if (!districtSelect || !formatSelect) {
          return;
        }

        const districtName = districtSelect.value;
        const format = formatSelect.value;

        setDistrictStatus("Préparation de l’export du niveau District…", "neutral");

        const governoratesGeojson = await getGovernoratesLayer();

        if (!governoratesGeojson) {
          setDistrictStatus(
            "Impossible de trouver automatiquement la couche des gouvernorats. Activez d’abord le niveau Gouvernorat, puis réessayez.",
            "error"
          );
          return;
        }

        const result = buildDistrictGeoJSON(governoratesGeojson, districtName);

        if (!result.geojson.features.length) {
          setDistrictStatus(
            "Aucun gouvernorat correspondant n’a été trouvé pour " + districtName + ".",
            "error"
          );
          return;
        }

        if (format === "geojson") {
          exportGeoJSON(result.geojson, districtName);
        }

        if (format === "kml") {
          exportKML(result.geojson, districtName);
        }

        if (format === "csv") {
          exportCSV(result.geojson, districtName);
        }

        if (result.missing.length) {
          setDistrictStatus(
            "Export réalisé, mais certains gouvernorats n’ont pas été trouvés : " + result.missing.join(", ") + ".",
            "error"
          );
        } else {
          setDistrictStatus(
            "Export terminé : " + districtName + " — " + result.geojson.features.length + " gouvernorat(s).",
            "success"
          );
        }
      }

      function createDistrictAdminBlock() {
        const wrapper = document.createElement("div");
        wrapper.className = "geomap-district-admin-block";
        wrapper.id = "geomap-district-admin-block";

        wrapper.innerHTML = [
          '<div class="geomap-district-admin-title">',
          '  <span>Districts</span>',
          '  <span class="geomap-district-admin-badge">Niveau supérieur</span>',
          '</div>',

          '<p class="geomap-district-admin-note">',
          '  Niveau administratif supérieur au gouvernorat. ',
          '  Le téléchargement produit les gouvernorats constitutifs du district.',
          '</p>',

          '<label for="geomap-district-select">Choisir un district</label>',
          '<select id="geomap-district-select">',
          '  <option value="District 1">District 1 — Béja, Bizerte, Jendouba, Le Kef</option>',
          '  <option value="District 2">District 2 — Ariana, Ben Arous, Manouba, Nabeul, Tunis, Zaghouan</option>',
          '  <option value="District 3">District 3 — Kairouan, Kasserine, Mahdia, Monastir, Siliana, Sousse</option>',
          '  <option value="District 4">District 4 — Gafsa, Sfax, Sidi Bouzid, Tozeur</option>',
          '  <option value="District 5">District 5 — Gabès, Kébili, Médenine, Tataouine</option>',
          '</select>',

          '<label for="geomap-district-format">Format d’export</label>',
          '<select id="geomap-district-format">',
          '  <option value="geojson">GeoJSON</option>',
          '  <option value="kml">KML</option>',
          '  <option value="csv">CSV attributaire</option>',
          '</select>',

          '<div class="geomap-district-admin-actions">',
          '  <button class="geomap-district-admin-button" type="button" id="geomap-district-download">',
          '    Télécharger le district',
          '  </button>',
          '</div>',

          '<div class="geomap-district-admin-status" id="geomap-district-admin-status">',
          '  En attente du chargement du niveau Gouvernorat…',
          '</div>',

          '<div class="geomap-district-admin-source">',
          '  Les limites internes ne sont pas encore dissoutes dans cette version.',
          '</div>'
        ].join("");

        return wrapper;
      }

      function findSmallestElementContaining(text) {
        const normalizedText = normalizeText(text);
        const elements = Array.from(document.querySelectorAll("aside, section, nav, div, form, main, article"));

        const matches = elements
          .filter(function (element) {
            return normalizeText(element.textContent).includes(normalizedText);
          })
          .sort(function (a, b) {
            return a.textContent.length - b.textContent.length;
          });

        return matches[0] || null;
      }

      function findAdministrativePanel() {
        const direct = findSmallestElementContaining("Découpage administratif");

        if (!direct) {
          return null;
        }

        let panel = direct;

        while (
          panel &&
          panel !== document.body &&
          !normalizeText(panel.textContent).includes("gouvernorat")
        ) {
          panel = panel.parentElement;
        }

        if (panel && panel !== document.body) {
          return panel;
        }

        panel = direct.parentElement;

        while (
          panel &&
          panel !== document.body &&
          panel.textContent &&
          panel.textContent.length < 6000
        ) {
          if (
            normalizeText(panel.textContent).includes("decoupage administratif") ||
            normalizeText(panel.textContent).includes("gouvernorat")
          ) {
            return panel;
          }

          panel = panel.parentElement;
        }

        return direct.parentElement || null;
      }

      function findGovernorateReferenceElement(panel) {
        if (!panel) {
          return null;
        }

        const candidates = Array.from(panel.querySelectorAll("label, button, div, span, p, h2, h3, h4"))
          .filter(function (element) {
            return normalizeText(element.textContent).includes("gouvernorat");
          })
          .sort(function (a, b) {
            return a.textContent.length - b.textContent.length;
          });

        if (!candidates.length) {
          return null;
        }

        let target = candidates[0];

        while (
          target.parentElement &&
          target.parentElement !== panel &&
          target.parentElement.textContent &&
          target.parentElement.textContent.length < 1200 &&
          normalizeText(target.parentElement.textContent).includes("gouvernorat")
        ) {
          target = target.parentElement;
        }

        return target;
      }

      function insertDistrictBlockIntoAdministrativeMenu() {
        if (document.getElementById("geomap-district-admin-block")) {
          return true;
        }

        const administrativePanel = findAdministrativePanel();

        if (!administrativePanel) {
          return false;
        }

        const districtBlock = createDistrictAdminBlock();
        const governorateElement = findGovernorateReferenceElement(administrativePanel);

        if (
          governorateElement &&
          governorateElement.parentElement &&
          governorateElement.parentElement !== document.body
        ) {
          governorateElement.parentElement.insertBefore(districtBlock, governorateElement);
        } else {
          administrativePanel.appendChild(districtBlock);
        }

        const button = document.getElementById("geomap-district-download");

        if (button) {
          button.addEventListener("click", handleDistrictDownload);
        }

        setTimeout(async function () {
          const layer = await getGovernoratesLayer();

          if (layer) {
            setDistrictStatus(
              "Données prêtes. Le niveau District peut être téléchargé.",
              "success"
            );
          } else {
            setDistrictStatus(
              "Activez ou chargez le niveau Gouvernorat pour permettre l’export des districts.",
              "error"
            );
          }
        }, 1200);

        return true;
      }

      function startDistrictMenuObserver() {
        const firstTry = insertDistrictBlockIntoAdministrativeMenu();

        if (firstTry) {
          return;
        }

        const observer = new MutationObserver(function () {
          const inserted = insertDistrictBlockIntoAdministrativeMenu();

          if (inserted) {
            observer.disconnect();
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });

        let tries = 0;

        const interval = setInterval(function () {
          tries += 1;

          const inserted = insertDistrictBlockIntoAdministrativeMenu();

          if (inserted || tries >= 60) {
            clearInterval(interval);

            if (inserted) {
              observer.disconnect();
            }
          }
        }, 500);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startDistrictMenuObserver);
      } else {
        startDistrictMenuObserver();
      }
    })();
  </script>
</body>
</html>
